<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zomi Radio · Playlist</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
body { background: linear-gradient(145deg, #0b1a2e 0%, #1b2f4b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.radio-app { max-width: 480px; width: 100%; background: rgba(18, 30, 48, 0.85); backdrop-filter: blur(12px); border-radius: 40px; padding: 28px 24px 32px; box-shadow: 0 30px 45px -15px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,215,100,0.15); border: 1px solid rgba(255,220,120,0.2); }
.station-header { display: flex; align-items: center; gap: 15px; margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,210,90,0.25); }
.logo-badge { width: 60px; height: 60px; background: linear-gradient(135deg, #f7c948, #e6a017); border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 18px -6px rgba(247,201,72,0.4); }
.logo-badge i { font-size: 34px; color: #0b1a2e; }
.station-title h1 { font-size: 26px; font-weight: 700; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.6); line-height: 1.2; letter-spacing: 1px; }
.station-title .sub { font-size: 14px; font-weight: 500; color: #f7c948; letter-spacing: 1.5px; text-transform: uppercase; display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.station-title .sub i { font-size: 11px; color: #ff5e5e; }
.live-tag { display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255,70,70,0.18); border: 1px solid rgba(255,80,80,0.5); border-radius: 60px; padding: 6px 14px; margin-bottom: 18px; font-size: 13px; font-weight: 600; color: #ff8a8a; letter-spacing: 0.8px; text-transform: uppercase; width: fit-content; margin-left: auto; margin-right: auto; }
.live-dot { width: 10px; height: 10px; background: #ff3b3b; border-radius: 50%; animation: pulse 1.5s infinite; box-shadow: 0 0 8px #ff3b3b; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } }
.album-art { background: radial-gradient(circle at 30% 20%, #263b5a, #0e1a2b); border-radius: 32px; padding: 22px 20px 18px; margin-bottom: 20px; box-shadow: inset 0 5px 8px rgba(0,0,0,0.5), 0 12px 20px -10px #000; border: 1px solid rgba(255,210,100,0.25); text-align: center; }
.disc-icon { font-size: 56px; color: #f7c948; filter: drop-shadow(0 0 12px rgba(247,201,72,0.6)); animation: rotateDisc 12s linear infinite; animation-play-state: paused; margin-bottom: 10px; }
.disc-icon.playing { animation-play-state: running; }
@keyframes rotateDisc { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.track-info .now-playing { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #f7c948; }
.track-info .song-title { font-size: 19px; font-weight: 700; margin: 6px 0 4px; color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.6); line-height: 1.3; }
.track-info .artist { font-size: 14px; color: #b0c4de; }
.progress-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; color: #b0c4de; font-size: 12px; }
.progress-row input[type="range"] { flex: 1; height: 5px; -webkit-appearance: none; background: #2e405e; border-radius: 8px; outline: none; cursor: pointer; }
.progress-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #f7c948; border-radius: 50%; box-shadow: 0 0 8px #f7c948cc; cursor: pointer; }
.bars { display: flex; justify-content: center; align-items: flex-end; gap: 5px; height: 26px; margin-top: 10px; }
.bar { width: 5px; background: linear-gradient(to top, #f7c948, #ffe28c); border-radius: 4px; height: 8px; box-shadow: 0 0 8px rgba(247,201,72,0.7); }
.bar.active { animation: barWave 1.2s infinite alternate ease-in-out; }
.bar:nth-child(1) { animation-delay: 0.1s; } .bar:nth-child(2) { animation-delay: 0.3s; } .bar:nth-child(3) { animation-delay: 0.5s; } .bar:nth-child(4) { animation-delay: 0.2s; } .bar:nth-child(5) { animation-delay: 0.7s; } .bar:nth-child(6) { animation-delay: 0.4s; } .bar:nth-child(7) { animation-delay: 0.9s; }
@keyframes barWave { 0% { height: 8px; opacity: 0.7; } 100% { height: 24px; opacity: 1; } }
.controls { display: flex; align-items: center; justify-content: center; gap: 24px; margin: 20px 0; }
.ctrl-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,215,100,0.3); width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: #f7c948; font-size: 22px; cursor: pointer; transition: all 0.2s; box-shadow: 0 8px 14px -6px rgba(0,0,0,0.6); }
.ctrl-btn:hover { background: rgba(247,201,72,0.15); border-color: #f7c948; transform: scale(1.05); }
.ctrl-btn:active { transform: scale(0.95); }
.ctrl-btn.play-btn { width: 74px; height: 74px; font-size: 32px; background: linear-gradient(145deg, #f7c948, #dfa81c); color: #0b1a2e; border: none; box-shadow: 0 12px 28px -6px #f7c94880, 0 0 0 2px rgba(255,240,150,0.4); }
.extra-row { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.25); border-radius: 60px; padding: 8px 16px; margin-bottom: 16px; border: 1px solid rgba(255,215,100,0.15); }
.volume-control { display: flex; align-items: center; gap: 12px; color: #b0c4de; flex: 1; }
.volume-control i { color: #f7c948; font-size: 15px; width: 18px; }
.volume-control input[type="range"] { flex: 1; height: 5px; -webkit-appearance: none; background: #2e405e; border-radius: 8px; outline: none; }
.volume-control input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #f7c948; border-radius: 50%; box-shadow: 0 0 10px #f7c948cc; border: 2px solid #0b1a2e; cursor: pointer; }
.playlist-title { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #f7c948; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
.playlist { max-height: 240px; overflow-y: auto; border-radius: 20px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,215,100,0.15); padding: 6px; }
.playlist::-webkit-scrollbar { width: 5px; }
.playlist::-webkit-scrollbar-thumb { background: #f7c94860; border-radius: 10px; }
.song-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; cursor: pointer; transition: background 0.2s; color: #d8e2f0; }
.song-item:hover { background: rgba(247,201,72,0.1); }
.song-item.active { background: rgba(247,201,72,0.18); border-left: 3px solid #f7c948; }
.song-num { font-size: 12px; color: #6a7f9c; width: 20px; text-align: center; font-weight: 600; }
.song-item.active .song-num, .song-item.active .song-name { color: #f7c948; }
.song-name { font-size: 14px; font-weight: 500; }
.song-sub { font-size: 11px; color: #8a9bb5; margin-top: 2px; }
.song-item i.play-icon { margin-left: auto; color: #f7c948; font-size: 12px; opacity: 0; }
.song-item.active i.play-icon { opacity: 1; }
.footer-note { text-align: center; font-size: 11px; color: #6a7f9c; margin-top: 14px; }
.toast-message { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1e2f44; color: #f7c948; padding: 12px 24px; border-radius: 60px; border: 1px solid #f7c948; font-weight: 500; box-shadow: 0 12px 30px #00000080; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; font-size: 14px; z-index: 999; display: flex; align-items: center; gap: 8px; }
.toast-message.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="radio-app">
<div class="station-header">
<div class="logo-badge"><i class="fas fa-broadcast-tower"></i></div>
<div class="station-title">
<h1>ZOMI RADIO</h1>
<div class="sub"><i class="fas fa-circle"></i> LIVE 24/7</div>
</div>
</div>
<div class="live-tag"><span class="live-dot"></span> ON AIR</div>
<div class="album-art">
<i class="fas fa-compact-disc disc-icon" id="discIcon"></i>
<div class="track-info">
<div class="now-playing">NOW PLAYING</div>
<div class="song-title" id="songTitle">—</div>
<div class="artist" id="artistName">—</div>
</div>
<div class="progress-row">
<span id="currentTime">0:00</span>
<input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
<span id="duration">0:00</span>
</div>
<div class="bars" id="waveBars">
<div class="bar"></div><div class="bar"></div><div class="bar"></div>
<div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
</div>
</div>
<div class="controls">
<button class="ctrl-btn" id="prevBtn"><i class="fas fa-backward"></i></button>
<button class="ctrl-btn play-btn" id="playPauseBtn"><i class="fas fa-play" id="playIcon"></i></button>
<button class="ctrl-btn" id="nextBtn"><i class="fas fa-forward"></i></button>
</div>
<div class="extra-row">
<div class="volume-control">
<i class="fas fa-volume-down"></i>
<input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
<i class="fas fa-volume-up"></i>
</div>
</div>
<div class="playlist-title"><i class="fas fa-list"></i> PLAYLIST</div>
<div class="playlist" id="playlistEl"></div>
<div class="footer-note"><i class="fas fa-headphones"></i> Streaming from GitHub · Zomi Radio</div>
</div>
<audio id="radioStream" preload="metadata"></audio>
<div class="toast-message" id="toast"><i class="fas fa-check-circle"></i> <span id="toastText"></span></div>

<script>
const GITHUB_BASE = "https://cinhan774.github.io/zomi-radio-station/";
const playlist = [
{ title: "Kei Hi Theilo Phadeuh,Pa", artist: "Siannuam", file: "Siannuam%20-%20Kei%20Hi%20Theilo%20Phadeuh,Pa%20(Official%20Music%20Video).mp3" },
{ title: "TOPA ADING HAKSA LO", artist: "Khual Pi", file: "TOPA%20ADING%20HAKSA%20LO%20_%20Khual%20Pi%20(Official%20Music%20Video).mp3" }
];
const audio = document.getElementById('radioStream');
const playPauseBtn = document.getElementById('playPauseBtn');
const playIcon = document.getElementById('playIcon');
const discIcon = document.getElementById('discIcon');
const waveBars = document.querySelectorAll('.bar');
const seekBar = document.getElementById('seekBar');
const currentTimeEl = document.getElementById('currentTime');
const durationEl = document.getElementById('duration');
const volumeSlider = document.getElementById('volumeSlider');
const songTitleEl = document.getElementById('songTitle');
const artistNameEl = document.getElementById('artistName');
const playlistEl = document.getElementById('playlistEl');
const toast = document.getElementById('toast');
const toastText = document.getElementById('toastText');
let currentIndex = 0, toastTimeout = null;
audio.volume = volumeSlider.value;
function showToast(msg) { if (toastTimeout) clearTimeout(toastTimeout); toastText.textContent = msg; toast.classList.add('show'); toastTimeout = setTimeout(() => toast.classList.remove('show'), 2400); }
function formatTime(sec) { if (isNaN(sec)) return '0:00'; const m = Math.floor(sec / 60); const s = Math.floor(sec % 60).toString().padStart(2, '0'); return `${m}:${s}`; }
function setPlayingUI(p) { if (p) { playIcon.classList.remove('fa-play'); playIcon.classList.add('fa-pause'); discIcon.classList.add('playing'); waveBars.forEach(b => b.classList.add('active')); } else { playIcon.classList.remove('fa-pause'); playIcon.classList.add('fa-play'); discIcon.classList.remove('playing'); waveBars.forEach(b => b.classList.remove('active')); } }
function loadSong(i, autoplay = true) { currentIndex = i; const s = playlist[i]; audio.src = GITHUB_BASE + s.file; songTitleEl.textContent = s.title; artistNameEl.textContent = s.artist; renderPlaylist(); if (autoplay) audio.play().catch(() => showToast('⚠️ Tap play to start')); }
function renderPlaylist() { playlistEl.innerHTML = ''; playlist.forEach((s, i) => { const item = document.createElement('div'); item.className = 'song-item' + (i === currentIndex ? ' active' : ''); item.innerHTML = `<span class="song-num">${i + 1}</span><div><div class="song-name">${s.title}</div><div class="song-sub">${s.artist}</div></div><i class="fas fa-volume-up play-icon"></i>`; item.addEventListener('click', () => loadSong(i, true)); playlistEl.appendChild(item); }); }
playPauseBtn.addEventListener('click', () => { if (audio.paused) audio.play().catch(() => showToast('⚠️ Tap again')); else audio.pause(); });
document.getElementById('prevBtn').addEventListener('click', () => { const i = currentIndex > 0 ? currentIndex - 1 : playlist.length - 1; loadSong(i, true); });
document.getElementById('nextBtn').addEventListener('click', () => { const i = (currentIndex + 1) % playlist.length; loadSong(i, true); });
audio.addEventListener('play', () => setPlayingUI(true));
audio.addEventListener('pause', () => setPlayingUI(false));
audio.addEventListener('loadedmetadata', () => durationEl.textContent = formatTime(audio.duration));
audio.addEventListener('timeupdate', () => { if (audio.duration) { seekBar.value = (audio.currentTime / audio.duration) * 100; currentTimeEl.textContent = formatTime(audio.currentTime); } });
audio.addEventListener('ended', () => loadSong((currentIndex + 1) % playlist.length, true));
audio.addEventListener('error', () => showToast('⚠️ Could not load: ' + playlist[currentIndex].title));
seekBar.addEventListener('input', () => { if (audio.duration) audio.currentTime = (seekBar.value / 100) * audio.duration; });
volumeSlider.addEventListener('input', () => audio.volume = parseFloat(volumeSlider.value));
loadSong(0, false);
setTimeout(() => showToast('📻 Welcome to Zomi Radio!'), 800);
</script>
</body>
</html>
